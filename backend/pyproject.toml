[project]
name = "reader-backend"
version = "0.1.0"
description = "FastAPI backend for the shared-source reading app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "crawl4ai==0.9.3",
    "feedparser>=6.0.11",
    "filelock>=3.20",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain==1.4.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.1.0",
    "pydantic-settings>=2.7.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pillow>=11.0.0",
    "email-validator>=2.2.0",
    "regex>=2024.11.6",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
reader-worker = "app.workers.main:main"
reader-admin = "app.admin.cli:main"
reader-web-rule = "app.ingestion.web_rule_cli:main"
reader-browser-adapter = "app.browser_tasks.adapter_app:main"
reader-browser-adapter-healthcheck = "app.browser_tasks.adapter_app:healthcheck_main"
reader-browser-manager = "app.browser_tasks.manager_app:main"
reader-browser-reaper = "app.browser_tasks.reaper:main"
reader-browser-admin = "app.browser_tasks.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: destructive migration checks against an explicitly disposable PostgreSQL DSN",
    "live_provider: guarded provider acceptance with a separate explicit live opt-in",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"
