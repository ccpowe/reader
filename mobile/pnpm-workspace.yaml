packages:
  - .

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - expo-build-properties@57.0.17
  - expo-image-picker@57.0.16
  - expo-secure-store@57.0.4
  - lucide-react-native@1.72.0

# patches/react-native-webview+13.16.1.patch (Android edge-to-edge insets for WebView and
# fullscreen video) is not applied since the SDK 58 upgrade (react-native-webview 14). Expo Go
# does not use it; before the next APK build, check whether 14.x fixes the issue, else port it.
